name: Axiom Provenance Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Cryptographic Provenance Verification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Axiom CLI
        run: cargo build --release --bin axiom

      - name: Run Provenance Gate
        uses: ./.github/actions/axiom-gate
        with:
          strict: "false"
          slsa: ".axiom/slsa-provenance.json"
