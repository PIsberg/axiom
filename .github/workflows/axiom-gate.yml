name: Axiom Provenance Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Cryptographic Provenance Verification
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Axiom CLI
        run: cargo build --release --bin axiom

      - name: Run Provenance Gate
        uses: ./.github/actions/axiom-gate
        with:
          strict: "false"
          slsa: ".axiom/slsa-provenance.json"
