name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A cold JVM toolchain fetches its compiler on first use. Measured on a fresh
  # runner: the first Scala evaluation spent 187s downloading and was correctly
  # killed at the 30s default and reported as TIMEOUT. Raising it here lets the
  # tests measure the recipe rather than the download.
  #
  # This does not weaken the deadline guard: eval_deadline.rs passes its own
  # two-second deadline to native::evaluate and never reads this variable.
  AXIOM_EVAL_TIMEOUT_SECS: "300"
  # Turns a vacuously green run red. The evaluator tests assert the refusal
  # branch when a toolchain is missing, so a runner that failed to install one
  # passes every test without running any of them, which is how the TypeScript
  # recipe reached main unrun (#9).
  AXIOM_REQUIRE_TOOLCHAINS: "1"

jobs:
  test:
    # Everything in this repository was measured on Windows. The Unix behaviour
    # of the file locking and the atomic writes was reasoned about rather than
    # run, so both platforms are tested rather than the cheaper one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # rust-analyzer produces the SCIP index the ingestion integration test
      # ingests. It is a rustup component, requested above, so the test runs the
      # real indexer rather than skipping; under AXIOM_REQUIRE_TOOLCHAINS a
      # missing one is a hard failure, so an install that did nothing goes red.

      # The tier 2 evaluator tests branch on whether a toolchain is installed,
      # and assert the refusal when it is not. That makes them pass on a runner
      # with nothing installed while never executing the half that matters,
      # which is how the TypeScript recipe reached main unrun (#9). python, node,
      # go and javac are already on both runners; TypeScript is not, so it is
      # installed here to make its running branch reachable in CI.
      - name: Install a TypeScript toolchain
        run: npm install -g typescript

      # Kotlin and Scala for the same reason. Without them the JVM cases assert
      # the refusal branch and say nothing about the recipes, which is how the
      # TypeScript one reached main unrun (#9). Both are JDK-based and the JDK
      # is already on the runners.
      - name: Install a Kotlin toolchain
        uses: fwilhe2/setup-kotlin@9d8379246506bb33a32b386d49868ee8cdc349b1 # main

      - name: Install a Scala toolchain
        uses: coursier/setup-action@039f736548afa5411c1382f40a5bd9c2d30e0383 # v1.3.9
        with:
          apps: scala scalac

      # C and C++ for the same reason (#79). Both runners ship a compiler:
      # ubuntu has cc and c++, the windows image has MinGW gcc and g++. This step
      # does not install one, it proves one is reachable, because
      # AXIOM_REQUIRE_TOOLCHAINS turns a missing compiler into a hard failure in
      # the Test step below and a failure there reads as a broken recipe rather
      # than as a runner without a compiler.
      - name: A C and C++ toolchain is reachable (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          (cc --version || gcc --version || clang --version)
          (c++ --version || g++ --version || clang++ --version)

      - name: A C and C++ toolchain is reachable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $c = @('cc','gcc','clang') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          $cxx = @('c++','g++','clang++') | Where-Object { Get-Command $_ -ErrorAction SilentlyContinue } | Select-Object -First 1
          if (-not $c) { throw 'no C compiler on PATH; the C recipe would assert only its refusal branch' }
          if (-not $cxx) { throw 'no C++ compiler on PATH; the C++ recipe would assert only its refusal branch' }
          & $c --version
          & $cxx --version

      - name: Test
        run: cargo test --release --all-targets

      - name: Build the binary
        run: cargo build --release --bin axiom

      - name: Concurrent agents keep their work (Unix)
        if: runner.os != 'Windows'
        run: python3 .github/scripts/concurrent_agents_check.py "$PWD/target/release/axiom"

      - name: Concurrent agents keep their work (Windows)
        if: runner.os == 'Windows'
        run: python .github/scripts/concurrent_agents_check.py "$env:GITHUB_WORKSPACE\target\release\axiom.exe"

      - name: Verify plugin installation and live MCP runtime (Unix)
        if: runner.os != 'Windows'
        run: python3 .github/scripts/test_plugin_installation.py "$PWD/target/release/axiom"

      - name: Verify plugin installation and live MCP runtime (Windows)
        if: runner.os == 'Windows'
        run: python .github/scripts/test_plugin_installation.py "$env:GITHUB_WORKSPACE\target\release\axiom.exe"

  plugin-install:
    name: Plugin Installation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Axiom from source (cargo install)
        run: cargo install --path crates/axiom-cli --locked

      - name: Verify installation from PATH (Unix)
        if: runner.os != 'Windows'
        run: |
          which axiom
          python3 .github/scripts/test_plugin_installation.py "$(which axiom)"

      - name: Verify installation from PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          Get-Command axiom
          python .github/scripts/test_plugin_installation.py (Get-Command axiom).Source

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

