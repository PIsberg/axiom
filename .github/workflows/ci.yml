name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A cold JVM toolchain fetches its compiler on first use. Measured on a fresh
  # runner: the first Scala evaluation spent 187s downloading and was correctly
  # killed at the 30s default and reported as TIMEOUT. Raising it here lets the
  # tests measure the recipe rather than the download.
  #
  # This does not weaken the deadline guard: eval_deadline.rs passes its own
  # two-second deadline to native::evaluate and never reads this variable.
  AXIOM_EVAL_TIMEOUT_SECS: "300"
  # Turns a vacuously green run red. The evaluator tests assert the refusal
  # branch when a toolchain is missing, so a runner that failed to install one
  # passes every test without running any of them, which is how the TypeScript
  # recipe reached main unrun (#9).
  AXIOM_REQUIRE_TOOLCHAINS: "1"

jobs:
  test:
    # Everything in this repository was measured on Windows. The Unix behaviour
    # of the file locking and the atomic writes was reasoned about rather than
    # run, so both platforms are tested rather than the cheaper one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2

      # rust-analyzer produces the SCIP index the ingestion integration test
      # ingests. It is a rustup component, requested above, so the test runs the
      # real indexer rather than skipping; under AXIOM_REQUIRE_TOOLCHAINS a
      # missing one is a hard failure, so an install that did nothing goes red.

      # The tier 2 evaluator tests branch on whether a toolchain is installed,
      # and assert the refusal when it is not. That makes them pass on a runner
      # with nothing installed while never executing the half that matters,
      # which is how the TypeScript recipe reached main unrun (#9). python, node,
      # go and javac are already on both runners; TypeScript is not, so it is
      # installed here to make its running branch reachable in CI.
      - name: Install a TypeScript toolchain
        run: npm install -g typescript

      # Kotlin and Scala for the same reason. Without them the JVM cases assert
      # the refusal branch and say nothing about the recipes, which is how the
      # TypeScript one reached main unrun (#9). Both are JDK-based and the JDK
      # is already on the runners.
      - name: Install a Kotlin toolchain
        uses: fwilhe2/setup-kotlin@main

      - name: Install a Scala toolchain
        uses: coursier/setup-action@v1
        with:
          apps: scala scalac

      - name: Test
        run: cargo test --release --all-targets

      - name: Build the binary
        run: cargo build --release --bin axiom

      - name: Concurrent agents keep their work (Unix)
        if: runner.os != 'Windows'
        run: python3 .github/scripts/concurrent_agents_check.py "$PWD/target/release/axiom"

      - name: Concurrent agents keep their work (Windows)
        if: runner.os == 'Windows'
        run: python .github/scripts/concurrent_agents_check.py "$env:GITHUB_WORKSPACE\target\release\axiom.exe"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
