[workspace]
resolver = "2"
members = [
    "crates/axiom-proto",
    "crates/axiom-vmm",
    "crates/axiom-ast",
    "crates/axiom-core",
    "crates/axiom-crdt",
    "crates/axiom-cli",
]

[workspace.package]
edition = "2024"
# Edition 2024 was stabilised in 1.85. Stated so a build on an older
# toolchain fails naming the version rather than the syntax.
rust-version = "1.85"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
blake3 = "1.8"
wasmtime = { version = "48.0", features = ["wat"] }
wasmtime-wasi = "48.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6", features = ["derive"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13"
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
# Replaces rand_core 0.6, which is where OsRng used to live. rand_core 0.10 has
# no OS generator and no features at all, and ed25519-dalek 3 wants an infallible
# CryptoRng that the OS cannot provide, so the seed is filled directly through
# getrandom::fill. That is the ungated core API: no feature needed.
getrandom = "0.4"
hex = "0.4"
tempfile = "3"
rayon = "1"
